<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 340"
     width="100%"
     height="100%"
     role="img"
     aria-label="MovieBox banner">

  <defs>

    <!-- Background -->
    <linearGradient id="bg"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020B25"/>
      <stop offset="55%" stop-color="#03133A"/>
      <stop offset="100%" stop-color="#020B25"/>
    </linearGradient>

    <!-- Movie Gradient -->
    <linearGradient id="movie"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A00"/>
      <stop offset="45%" stop-color="#FF9D00"/>
      <stop offset="100%" stop-color="#FFD21A"/>
    </linearGradient>

    <!-- Box Gradient -->
    <linearGradient id="box"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BEAFF"/>
      <stop offset="35%" stop-color="#28CFFF"/>
      <stop offset="70%" stop-color="#087CFF"/>
      <stop offset="100%" stop-color="#153BEA"/>
    </linearGradient>

    <!-- Film Gradient -->
    <linearGradient id="film"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6500"/>
      <stop offset="30%" stop-color="#FF9F00"/>
      <stop offset="55%" stop-color="#FFD21A"/>
      <stop offset="80%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#FF6900"/>
    </linearGradient>

    <!-- Blue Play -->
    <linearGradient id="bluePlay"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19DFFF"/>
      <stop offset="45%" stop-color="#087CFF"/>
      <stop offset="100%" stop-color="#1439E8"/>
    </linearGradient>

    <!-- Arrow -->
    <linearGradient id="arrow"
                    x1="50%" y1="0%"
                    x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFE32A"/>
      <stop offset="45%" stop-color="#FFC000"/>
      <stop offset="75%" stop-color="#FF9700"/>
      <stop offset="100%" stop-color="#FF6500"/>
    </linearGradient>

    <!-- Dots -->
    <pattern id="dots"
             width="18"
             height="18"
             patternUnits="userSpaceOnUse">
      <circle cx="4"
              cy="4"
              r="1.2"
              fill="#0877E8"
              opacity="0.5"/>
    </pattern>

    <!-- Text Glow -->
    <filter id="textGlow"
            x="-30%"
            y="-50%"
            width="160%"
            height="200%">
      <feGaussianBlur stdDeviation="5"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Icon Glow -->
    <filter id="iconGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="4"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ================================= -->
  <!-- BACKGROUND -->
  <!-- ================================= -->

  <rect width="1280"
        height="340"
        fill="url(#bg)"/>

  <!-- Top dots -->
  <rect x="0"
        y="0"
        width="1280"
        height="70"
        fill="url(#dots)"
        opacity="0.6"/>

  <!-- Bottom dots -->
  <rect x="0"
        y="315"
        width="1280"
        height="25"
        fill="url(#dots)"
        opacity="0.6"/>


  <!-- ================================= -->
  <!-- MOVIEBOX TEXT -->
  <!-- ================================= -->

  <text x="82"
        y="176"
        font-family="Arial, Helvetica, sans-serif"
        font-size="112"
        font-weight="900"
        letter-spacing="-5"
        fill="url(#movie)"
        filter="url(#textGlow)">
    Movie
  </text>

  <text x="505"
        y="176"
        font-family="Arial, Helvetica, sans-serif"
        font-size="112"
        font-weight="900"
        letter-spacing="-5"
        fill="url(#box)"
        filter="url(#textGlow)">
    Box
  </text>


  <!-- ================================= -->
  <!-- STAR -->
  <!-- ================================= -->

  <path
    d="M790 36
       L796 55
       L816 61
       L796 67
       L790 87
       L784 67
       L764 61
       L784 55Z"
    fill="#FFFFFF"
    filter="url(#textGlow)"/>


  <!-- ================================= -->
  <!-- SUBTITLE -->
  <!-- ================================= -->

  <text x="86"
        y="250"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="400"
        letter-spacing="0"
        fill="#FFFFFF">
    Watch Movies/TV for Free
  </text>


  <!-- ================================= -->
  <!-- RIGHT SIDE MOVIEBOX ICON -->
  <!-- ================================= -->

  <!-- Blue play shape -->

  <path
    d="M1030 25
       L1192 120
       Q1220 137 1192 154
       L1030 250
       Q980 268 980 214
       L980 62
       Q980 8 1030 25Z"
    fill="url(#bluePlay)"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linejoin="round"
    filter="url(#iconGlow)"/>


  <!-- Blue highlight -->

  <path
    d="M1090 72
       L1190 127
       Q1202 137 1190 145
       L1090 203Z"
    fill="#24D7FF"
    opacity="0.45"/>


  <!-- Orange Film -->

  <path
    d="M1017 25
       Q980 13 980 62
       L980 214
       Q980 268 1017 250
       L1091 206
       L1091 68Z"
    fill="url(#film)"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linejoin="round"/>


  <!-- Film highlight -->

  <path
    d="M991 40
       Q987 48 987 64
       L987 210
       Q987 235 997 244
       L1015 233
       L1015 34
       Q1001 34 991 40Z"
    fill="#FF6500"
    opacity="0.35"/>


  <!-- Film holes -->

  <rect x="995"
        y="40"
        width="14"
        height="25"
        rx="5"
        fill="#06152F"/>

  <rect x="995"
        y="78"
        width="14"
        height="25"
        rx="5"
        fill="#06152F"/>

  <rect x="995"
        y="116"
        width="14"
        height="25"
        rx="5"
        fill="#06152F"/>

  <rect x="995"
        y="154"
        width="14"
        height="25"
        rx="5"
        fill="#06152F"/>

  <rect x="995"
        y="192"
        width="14"
        height="25"
        rx="5"
        fill="#06152F"/>


  <!-- ================================= -->
  <!-- CENTER DOWNLOAD ARROW -->
  <!-- PERFECTLY SYMMETRICAL -->
  <!-- ================================= -->

  <path
    d="M1050 70
       L1082 70
       L1082 150
       L1117 150
       L1066 236
       L1015 150
       L1050 150
       Z"
    fill="url(#arrow)"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#iconGlow)"/>


  <!-- Arrow highlight -->

  <path
    d="M1057 77
       L1075 77
       L1075 154
       L1096 154
       L1066 204
       L1036 154
       L1057 154Z"
    fill="#FFF36A"
    opacity="0.22"/>


  <!-- Icon gloss -->

  <path
    d="M1017 27 L1190 128"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.5"
    opacity="0.35"/>


</svg>
